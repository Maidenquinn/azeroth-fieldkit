name: Refresh v0.4.0 generated audit evidence
on:
  push:
    branches: [release/v0.4.0-prep]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'Maidenquinn/azeroth-fieldkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.4.0-prep
          persist-credentials: true
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Regenerate source inventory
        run: python tools/audit.py
      - name: Validate runtime with Lua fixtures
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/verify.py
          cp build/validation.json docs/validation.json
      - name: Commit reproducible generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUDIT_INVENTORY.json docs/CODE_INDEX.md docs/validation.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh v0.4.0 generated audit inventory"
            git push origin HEAD:release/v0.4.0-prep
          fi
