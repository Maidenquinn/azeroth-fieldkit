name: Verify review candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/audit.py
      - run: python tools/verify.py
      # The chat isolation candidate changes a runtime module. Generate matching
      # review evidence in the CI checkout before packaging; no repository push.
      - name: Snapshot generated review evidence
        run: |
          cp build/validation.json docs/validation.json
          git config user.name "fieldkit-ci"
          git config user.email "fieldkit-ci@users.noreply.github.com"
          git add docs/AUDIT_INVENTORY.json docs/CODE_INDEX.md docs/validation.json
          git commit -m "ci: snapshot isolated chat candidate audit evidence" || true
      - run: python tools/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technical-review-candidate
          path: |
            dist/*
            build/validation.json
