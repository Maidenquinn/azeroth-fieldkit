name: Publish Azeroth FieldKit v0.5.0
# Legacy v0.5.0 publisher: manual-only and version-locked.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-azeroth-fieldkit-050
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release version and maintainer acceptance
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('AzerothFieldKit')
          toc=(root/'AzerothFieldKit.toc').read_text()
          runtime=(root/'Runtime.lua').read_text()
          p=json.loads(pathlib.Path('data/publication-status.json').read_text())
          assert '## Version: 0.5.0\n' in toc
          assert 'version = "0.5.0"' in runtime
          assert p['version']=='0.5.0'
          assert p['maintainerAcceptedForPublication'] is True
          assert p['maintainerAcceptanceDate']
          PY
      - name: Install test requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Audit and test
        run: |
          python tools/audit.py
          python tools/verify.py
      - name: Prepare fresh verification evidence for package
        run: |
          cp build/validation.json docs/validation.json
          git config user.name "fieldkit-ci"
          git config user.email "fieldkit-ci@users.noreply.github.com"
          git add docs/AUDIT_INVENTORY.json docs/CODE_INDEX.md docs/validation.json
          git commit -m "ci: generate v0.5.0 release evidence" || true
      - name: Build and verify distribution
        run: |
          python tools/package.py
          python - <<'PY'
          import pathlib,zipfile
          p=pathlib.Path('dist/AzerothFieldKit-0.5.0.zip')
          assert p.is_file()
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert 'AzerothFieldKit/AzerothFieldKit.toc' in z.namelist()
          PY
      - name: Publish immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            echo "v0.5.0 already exists: refusing to replace it"
            exit 1
          fi
          gh release create v0.5.0 \
            dist/AzerothFieldKit-0.5.0.zip \
            dist/SHA256SUMS.txt \
            dist/MANIFEST.json \
            --target "${GITHUB_SHA}" \
            --title "Azeroth FieldKit v0.5.0" \
            --notes-file docs/RELEASE_NOTES_0.5.0.md \
            --latest
