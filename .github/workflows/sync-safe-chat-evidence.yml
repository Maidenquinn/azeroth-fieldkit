name: Refresh safe chat test evidence
on:
  push:
    branches: [fix/chat-visible-native-safe-mode]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-visible-native-safe-mode
          persist-credentials: true
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: python tools/audit.py
      - run: |
          python -m pip install -r requirements-dev.txt
          python tools/verify.py
          cp build/validation.json docs/validation.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUDIT_INVENTORY.json docs/CODE_INDEX.md docs/validation.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh native chat visibility regression evidence"
            git push origin HEAD:fix/chat-visible-native-safe-mode
          fi
