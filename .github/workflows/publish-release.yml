name: Publish FieldKit release

# Manual-only: never auto-publish a stale release when a PR merges.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Validate the audited runtime and build the distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Release must be dispatched from main"; exit 1; }
          VERSION=$(sed -n 's/^## Version: //p' AzerothFieldKit/AzerothFieldKit.toc | head -1)
          test "$VERSION" = "0.6.0"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v$VERSION"
          fi
          python - <<'PY'
          import json
          p=json.load(open("data/publication-status.json"))
          assert p["version"]=="0.6.0", "Release metadata version mismatch"
          assert p["maintainerAcceptedForPublication"] is True, "Maintainer publication approval required"
          assert p.get("maintainerAcceptanceDate"), "Acceptance date required"
          PY
          python -m pip install -r requirements-dev.txt
          python tools/audit.py
          python tools/verify.py
          cp build/validation.json docs/validation.json
          python tools/package.py
          test -f "dist/AzerothFieldKit-$VERSION.zip"
          unzip -t "dist/AzerothFieldKit-$VERSION.zip" >/dev/null
          FIRST_HASH=$(sha256sum "dist/AzerothFieldKit-$VERSION.zip" | cut -d' ' -f1)
          python tools/package.py
          SECOND_HASH=$(sha256sum "dist/AzerothFieldKit-$VERSION.zip" | cut -d' ' -f1)
          test "$FIRST_HASH" = "$SECOND_HASH"
          cp build/validation.json dist/validation.json
      - name: Tag and publish verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.6.0"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it unchanged"
            exit 0
          fi
          gh release create "$TAG" "dist/AzerothFieldKit-$VERSION.zip" dist/SHA256SUMS.txt dist/MANIFEST.json dist/validation.json --title "Azeroth FieldKit $VERSION" --notes-file "docs/RELEASE_$VERSION.md" --verify-tag
