name: Refresh FieldKit chat feature evidence
on:
  push:
    branches: [feat/fieldkit-chat-prat-controls]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fieldkit-chat-prat-controls
          persist-credentials: true
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: python tools/audit.py
      - name: Verify Lua fixtures and update evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/verify.py
          cp build/validation.json docs/validation.json
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUDIT_INVENTORY.json docs/CODE_INDEX.md docs/validation.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh chat feature audit evidence"
            git push origin HEAD:feat/fieldkit-chat-prat-controls
          fi
